<!doctype html>
<html lang="az">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <title>Video hazırdır</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="video-page">

    <div class="top-bar">
        <a href="{{ url_for('index') }}" class="back-btn">
            ← Geri
        </a>

        <span class="page-title">
            Video
        </span>
    </div>

    <div class="video-container">

        <video
            class="video-player"
            controls
            playsinline
            preload="metadata"
        >
            <source
                src="{{ video_url }}"
                type="video/mp4"
            >

            Brauzeriniz video formatını dəstəkləmir.
        </video>

    </div>

    <div class="video-info">

        <div class="success-icon">
            ✓
        </div>

        <h1>Video hazırdır</h1>

        <p>
            Videoya baxa və telefonuna endirə bilərsən.
        </p>

        <a
            href="{{ video_url }}"
            download
            class="download-button"
        >
            ↓ Videonu endir
        </a>

        <a
            href="{{ url_for('index') }}"
            class="new-video"
        >
            + Yeni video yüklə
        </a>

    </div>

</div>

</body>
</html>
