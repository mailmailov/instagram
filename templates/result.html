<!doctype html>
<html lang="az">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title id="pageTitle">
        Video hazırdır
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<div class="video-page">


    <!-- =========================
         ÜST PANEL
    ========================== -->

    <div class="top-bar">


        <a
            href="{{ url_for('index') }}"
            class="back-btn"
            id="backButton"
        >
            ← Geri
        </a>


        <span
            class="page-title"
            id="pageTitleText"
        >
            Video
        </span>


        <!-- DİL SEÇİMİ -->

        <div class="language-box">


            <button
                type="button"
                class="language-btn"
                onclick="changeLanguage('az')"
            >
                AZ
            </button>


            <button
                type="button"
                class="language-btn"
                onclick="changeLanguage('en')"
            >
                EN
            </button>


            <button
                type="button"
                class="language-btn"
                onclick="changeLanguage('ru')"
            >
                RU
            </button>


            <button
                type="button"
                class="language-btn"
                onclick="changeLanguage('tr')"
            >
                TR
            </button>


        </div>


    </div>



    <!-- =========================
         VIDEO
    ========================== -->

    <div class="video-container">


        <video
            id="videoPlayer"
            class="video-player"
            controls
            playsinline
            preload="metadata"
        >

            <source
                src="{{ url_for('files', filename=filename) }}"
                type="video/mp4"
            >

            Brauzeriniz video formatını
            dəstəkləmir.

        </video>


    </div>



    <!-- =========================
         VIDEO MƏLUMATLARI
    ========================== -->

    <div class="video-info">


        <!-- UĞUR İŞARƏSİ -->

        <div class="success-icon">
            ✓
        </div>


        <!-- BAŞLIQ -->

        <h1 id="readyTitle">
            Video hazırdır
        </h1>


        <!-- AÇIQLAMA -->

        <p id="readyDescription">
            Videoya baxa və telefonuna endirə bilərsən.
        </p>



        <!-- =====================
             MÜDDƏT + ÖLÇÜ
        ====================== -->

        <div class="video-details">


            <!-- MÜDDƏT -->

            <div class="detail-box">


                <span class="detail-icon">
                    ⏱️
                </span>


                <div>

                    <small id="durationLabel">
                        Video müddəti
                    </small>


                    <strong id="videoDuration">
                        --
                    </strong>

                </div>


            </div>



            <!-- FAYL ÖLÇÜSÜ -->

            <div class="detail-box">


                <span class="detail-icon">
                    📦
                </span>


                <div>

                    <small id="sizeLabel">
                        Fayl ölçüsü
                    </small>


                    <strong id="fileSize">
                        --
                    </strong>

                </div>


            </div>


        </div>



        <!-- =========================
             DOWNLOAD
        ========================== -->

        <a
            href="{{ url_for('files', filename=filename) }}"
            download
            class="download-button"
            id="downloadButton"
        >
            ↓ Videonu endir
        </a>



        <!-- =========================
             SHARE
        ========================== -->

        <button
            type="button"
            class="share-button"
            id="shareButton"
        >
            📤 Paylaş
        </button>



        <!-- =========================
             YENİ VİDEO
        ========================== -->

        <a
            href="{{ url_for('index') }}"
            class="new-video"
            id="newVideoButton"
        >
            + Yeni video yüklə
        </a>


    </div>


</div>



<script>


/* ==========================================
   DİLLƏR
========================================== */


const translations = {


    az: {

        pageTitle:
            "Video hazırdır",

        pageTitleText:
            "Video",

        back:
            "← Geri",

        readyTitle:
            "Video hazırdır",

        readyDescription:
            "Videoya baxa və telefonuna endirə bilərsən.",

        duration:
            "Video müddəti",

        size:
            "Fayl ölçüsü",

        download:
            "↓ Videonu endir",

        share:
            "📤 Paylaş",

        copied:
            "✓ Link kopyalandı",

        newVideo:
            "+ Yeni video yüklə"

    },


    en: {

        pageTitle:
            "Video Ready",

        pageTitleText:
            "Video",

        back:
            "← Back",

        readyTitle:
            "Video is ready",

        readyDescription:
            "You can watch the video and download it to your phone.",

        duration:
            "Video duration",

        size:
            "File size",

        download:
            "↓ Download Video",

        share:
            "📤 Share",

        copied:
            "✓ Link copied",

        newVideo:
            "+ Download another video"

    },


    ru: {

        pageTitle:
            "Видео готово",

        pageTitleText:
            "Видео",

        back:
            "← Назад",

        readyTitle:
            "Видео готово",

        readyDescription:
            "Вы можете посмотреть видео и скачать его на телефон.",

        duration:
            "Продолжительность",

        size:
            "Размер файла",

        download:
            "↓ Скачать видео",

        share:
            "📤 Поделиться",

        copied:
            "✓ Ссылка скопирована",

        newVideo:
            "+ Скачать другое видео"

    },


    tr: {

        pageTitle:
            "Video hazır",

        pageTitleText:
            "Video",

        back:
            "← Geri",

        readyTitle:
            "Video hazır",

        readyDescription:
            "Videoyu izleyebilir ve telefonunuza indirebilirsiniz.",

        duration:
            "Video süresi",

        size:
            "Dosya boyutu",

        download:
            "↓ Videoyu indir",

        share:
            "📤 Paylaş",

        copied:
            "✓ Bağlantı kopyalandı",

        newVideo:
            "+ Yeni video indir"

    }

};



/* ==========================================
   DİL DƏYİŞDİRMƏ
========================================== */


function changeLanguage(language) {


    const text =
        translations[language];


    document.documentElement.lang =
        language;


    document.getElementById(
        "pageTitle"
    ).textContent =
        text.pageTitle;


    document.getElementById(
        "pageTitleText"
    ).textContent =
        text.pageTitleText;


    document.getElementById(
        "backButton"
    ).textContent =
        text.back;


    document.getElementById(
        "readyTitle"
    ).textContent =
        text.readyTitle;


    document.getElementById(
        "readyDescription"
    ).textContent =
        text.readyDescription;


    document.getElementById(
        "durationLabel"
    ).textContent =
        text.duration;


    document.getElementById(
        "sizeLabel"
    ).textContent =
        text.size;


    document.getElementById(
        "downloadButton"
    ).textContent =
        text.download;


    document.getElementById(
        "shareButton"
    ).textContent =
        text.share;


    document.getElementById(
        "newVideoButton"
    ).textContent =
        text.newVideo;


    localStorage.setItem(
        "language",
        language
    );

}



/* ==========================================
   SON SEÇİLƏN DİL
========================================== */


const savedLanguage =
    localStorage.getItem(
        "language"
    ) || "az";


changeLanguage(
    savedLanguage
);



/* ==========================================
   VIDEO
========================================== */


const video =
    document.getElementById(
        "videoPlayer"
    );


const durationElement =
    document.getElementById(
        "videoDuration"
    );



/* ==========================================
   VIDEO MÜDDƏTİ
========================================== */


video.addEventListener(
    "loadedmetadata",
    function () {


        const totalSeconds =
            Math.floor(
                video.duration
            );


        if (
            !isFinite(
                totalSeconds
            )
        ) {

            durationElement.textContent =
                "--";

            return;

        }


        const minutes =
            Math.floor(
                totalSeconds / 60
            );


        const seconds =
            totalSeconds % 60;


        durationElement.textContent =
            minutes +
            ":" +
            String(
                seconds
            ).padStart(
                2,
                "0"
            );

    }
);



/* ==========================================
   FAYL ÖLÇÜSÜ
========================================== */


const fileSizeElement =
    document.getElementById(
        "fileSize"
    );


fetch(
    "{{ url_for('files', filename=filename) }}",
    {
        method: "HEAD"
    }
)

.then(
    function (response) {

        const size =
            response.headers.get(
                "Content-Length"
            );


        if (!size) {

            fileSizeElement.textContent =
                "--";

            return;

        }


        const bytes =
            parseInt(
                size
            );


        if (
            bytes < 1024
        ) {

            fileSizeElement.textContent =
                bytes +
                " B";

        }


        else if (
            bytes < 1024 * 1024
        ) {

            fileSizeElement.textContent =
                (
                    bytes / 1024
                ).toFixed(1)
                + " KB";

        }


        else {

            fileSizeElement.textContent =
                (
                    bytes /
                    1024 /
                    1024
                ).toFixed(2)
                + " MB";

        }

    }
)

.catch(
    function () {

        fileSizeElement.textContent =
            "--";

    }
);



/* ==========================================
   SHARE
========================================== */


const shareButton =
    document.getElementById(
        "shareButton"
    );


shareButton.addEventListener(
    "click",
    async function () {


        const videoUrl =
            window.location.origin +
            "{{ url_for('files', filename=filename) }}";


        const currentLanguage =
            localStorage.getItem(
                "language"
            ) || "az";


        try {


            /* TELEFON SHARE MENYUSU */


            if (
                navigator.share
            ) {


                await navigator.share({

                    title:
                        "Instagram Video",

                    text:
                        "Video",

                    url:
                        videoUrl

                });


                return;

            }



            /* SHARE DƏSTƏKLƏNMİRSƏ
               LINKİ KOPYALA */


            await navigator.clipboard.writeText(
                videoUrl
            );


            shareButton.textContent =
                translations[
                    currentLanguage
                ].copied;


            setTimeout(
                function () {

                    shareButton.textContent =
                        translations[
                            currentLanguage
                        ].share;

                },
                2000
            );


        }


        catch (error) {


            console.log(
                "Share cancelled:",
                error
            );


        }

    }
);


</script>


</body>

</html>
